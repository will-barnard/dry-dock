<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}dry-dock{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    pre.log { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-slate-50 px-6 py-3 flex items-center justify-between">
    <a href="/" class="font-mono font-semibold tracking-tight text-lg">dry-dock</a>
    <nav class="text-sm space-x-4">
      <a href="/" class="hover:text-amber-300">Projects</a>
    </nav>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
