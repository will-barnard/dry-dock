<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dry Dock{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚢</text></svg>" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    pre.log { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-slate-900 text-slate-50 px-6 py-3 flex items-center justify-between">
    <a href="/" class="font-mono font-semibold tracking-tight text-lg">🚢 Dry Dock</a>
    <nav class="text-sm flex items-center gap-4">
      <a href="/" class="hover:text-amber-300">Modules</a>
      <a href="/settings" class="hover:text-amber-300">Settings</a>
      {% if user %}
        <span class="text-xs text-slate-400 font-mono hidden sm:inline">{{ user.name or user.email }}</span>
        <form method="post" action="/logout" class="m-0">
          <button class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded">Sign out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
