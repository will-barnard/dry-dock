services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: drydock
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: drydock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drydock -d drydock"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://drydock:${DB_PASSWORD}@postgres:5432/drydock
      DATABASE_URL_SYNC: postgresql://drydock:${DB_PASSWORD}@postgres:5432/drydock
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      DRYDOCK_BASE_URL: ${DRYDOCK_BASE_URL}
      DRYDOCK_HOST_AGENT_URL: ${DRYDOCK_HOST_AGENT_URL:-http://host.docker.internal:8088}
      DRYDOCK_HOST_AGENT_TOKEN: ${DRYDOCK_HOST_AGENT_TOKEN:-}
      REMOTE_MACHINES_JSON: ${REMOTE_MACHINES_JSON:-[]}
      DEFAULT_CODE_MODEL: qwen2.5-coder:32b
      DEFAULT_PLANNER_MODEL: qwen2.5-coder:32b
      # Operator web search (Phase 1). Off by default — set
      # WEB_SEARCH_ENABLED=true in the Beachhead env to flip it on. SEARXNG_URL
      # is the in-network address of the searxng service.
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      WEB_SEARCH_BACKEND: ${WEB_SEARCH_BACKEND:-searxng}
      SEARXNG_URL: ${SEARXNG_URL:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_DAILY_BUDGET: ${WEB_SEARCH_DAILY_BUDGET:-200}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-5.0}
      # Scout headless renderer (internal service).
      RENDERER_URL: ${RENDERER_URL:-http://renderer:3000}
      RENDERER_TIMEOUT_SECONDS: ${RENDERER_TIMEOUT_SECONDS:-30.0}
      LOG_LEVEL: INFO
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - repos_data:/var/lib/drydock/repos
    # Backend reaches the host-side WoL/shutdown agent at host.docker.internal.
    # Docker Desktop for Mac wires this automatically; the explicit entry is
    # belt-and-suspenders in case Beachhead runs the daemon under colima or
    # plain Docker Engine where it isn't auto-provisioned.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  renderer:
    build:
      context: ./renderer
    restart: unless-stopped
    expose:
      - "3000"
    # Chromium is memory-hungry; give it room and a healthcheck so the
    # backend can depend on it being ready.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/healthz').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
    name: dry-dock-postgres
  repos_data:
    name: dry-dock-repos

networks:
  internal:
    driver: bridge
