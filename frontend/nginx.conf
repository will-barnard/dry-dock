map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS — resolve backend at request time, not config-load time.
    # ipv6=off is required: without it Docker DNS returns SERVFAIL on AAAA lookups
    # and nginx surfaces "host not found in upstream" at request time even though
    # startup is clean.
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 25m;

    # WebSocket route for workers — keep this BEFORE the catch-all so Upgrade headers stick.
    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived worker connections — disable buffering and bump timeouts.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # SSE / streaming log endpoints — disable buffering here too.
    location /stream/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
