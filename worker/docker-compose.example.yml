# Drop this on a Mac (mac mini, MacBook, etc.) to run a dry-dock worker.
# Ollama is expected to be installed on the host (brew install ollama && ollama serve).
# Worker container reaches the host's Ollama via host.docker.internal.
#
#   cp .env.example .env  # then fill in
#   docker compose up -d
#
# To run multiple worker pools on the same machine (e.g. the MacBook serving
# both 'coder' and 'planner'), copy this file twice and change WORKER_NAME and
# WORKER_POOL per service.

services:
  worker:
    build:
      context: .
    image: drydock-worker:latest
    restart: unless-stopped
    environment:
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL}          # e.g. wss://drydock.example.com/ws/worker
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
      WORKER_NAME: ${WORKER_NAME}                    # e.g. macbook-coder-1
      WORKER_POOL: ${WORKER_POOL}                    # planner | coder | reviewer | tester | refactorer | docs | researcher | validator
      HARDWARE_CLASS: ${HARDWARE_CLASS}              # macbook | mac-mini | linux
      RAM_GB: ${RAM_GB}                              # advertised RAM
      MAX_CONTEXT: ${MAX_CONTEXT}                    # advertised max context tokens (imagers leave it unset; blank falls back to the code default)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5-coder:32b}
      GPU_VRAM_GB: ${GPU_VRAM_GB:-0}
      GPU_MODEL: ${GPU_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      # Darkroom imager (WORKER_POOL=imager). Listed unconditionally because
      # compose only forwards variables named here — a value in the .env file
      # that isn't in this block never reaches the container. Harmless on a
      # text worker, which ignores them.
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_DEFAULT_CHECKPOINT: ${COMFYUI_DEFAULT_CHECKPOINT:-}
      COMFYUI_TIMEOUT_SECONDS: ${COMFYUI_TIMEOUT_SECONDS:-300}
      COMFYUI_STARTUP_WAIT_SECONDS: ${COMFYUI_STARTUP_WAIT_SECONDS:-240}
      WORKER_CAPABILITIES: ${WORKER_CAPABILITIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Per-worker host directory for ephemeral clones. Override in the .env
      # file with WORKTREE_HOST_DIR=/Volumes/FastSSD/dry-dock/<worker-name>
      # if you want a specific worker to write to a different disk.
      - ${WORKTREE_HOST_DIR:-./worktrees}:/app/worktrees
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # If this worker runs on the SAME machine that hosts Beachhead /
      # the orchestrator, uncomment the next line (replacing the hostname
      # with your actual Beachhead domain) so the worker resolves the
      # public hostname to the local Docker host instead of trying to
      # hairpin out and back through your router. The TLS cert stays
      # valid because the SNI/Host header is still the real hostname.
      # - "drydock.your-domain.com:host-gateway"
